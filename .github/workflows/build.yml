name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Package
        run: ./gradlew shadowJar --no-daemon

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcyas-idconverter-jar
          path: build/libs/MCYAS-IDConverter-*.jar
          if-no-files-found: error

      - name: Javadoc
        run: ./gradlew javadoc --no-daemon

      - name: Upload Javadoc artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcyas-javadoc
          path: build/docs/javadoc
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/javadoc

      - name: Prepare pre-release
        if: github.event_name == 'push'
        id: pre
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          SHORT_SHA="$(printf '%.7s' "${GITHUB_SHA}")"

          if [ "${BRANCH}" = "main" ]; then
            TAG="pre-release"
            TITLE="Pre-release/development build (main)"
            BLURB="Rolling build from main; overwritten on each green push."
          else
            SAFE="$(printf '%s' "${BRANCH}" | tr '/' '-' | tr -cd 'A-Za-z0-9._-' | cut -c1-80)"
            if [ -z "${SAFE}" ]; then
              echo "skip=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            TAG="pre/${SAFE}"
            TITLE="Pre-release/development build (${BRANCH})"
            BLURB="Branch build; overwritten on each green push. Removed when the branch is merged/closed or deleted."
          fi

          mapfile -t JARS < <(find build/libs -maxdepth 1 -type f -name 'MCYAS-IDConverter-*.jar' ! -name '*-thin.jar' | sort)
          if [ "${#JARS[@]}" -ne 1 ]; then
            echo "Expected exactly one shadow JAR, found ${#JARS[@]}"
            ls -la build/libs || true
            exit 1
          fi

          mkdir -p dist
          JAR_NAME="MCYAS-IDConverter-${SHORT_SHA}.jar"
          mv "${JARS[0]}" "dist/${JAR_NAME}"

          # Recreate the release each run so the tag (and auto-generated source
          # archives) point at this commit instead of retaining the first tag.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release delete "${TAG}" --yes --cleanup-tag
          fi

          {
            echo "skip=false"
            echo "tag=${TAG}"
            echo "title=${TITLE}"
            echo "blurb=${BLURB}"
            echo "jar_path=dist/${JAR_NAME}"
            echo "jar_name=${JAR_NAME}"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish pre-release
        if: github.event_name == 'push' && steps.pre.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pre.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.pre.outputs.title }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          body: |
            Automated **pre-release** from `${{ github.ref_name }}` (`${{ github.sha }}`).

            Artifact: `${{ steps.pre.outputs.jar_name }}`

            ${{ steps.pre.outputs.blurb }}

            Not a stable release — use a manually published versioned release for production.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: ${{ steps.pre.outputs.jar_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-test:
    name: Launch on JDK ${{ matrix.jdk }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: [ "17", "21", "25" ]
    steps:
      - uses: actions/setup-java@v4
        id: runtime
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - uses: actions/download-artifact@v4
        with:
          name: mcyas-idconverter-jar
          path: dist

      # Compiling and unit tests both pass for artifacts that cannot launch:
      # Main.main used to be package-private, which JDK 25's relaxed launcher
      # accepted but JDK 17's did not.
      - name: Launch artifact
        run: |
          set -euo pipefail
          JAR="$(find dist -maxdepth 1 -type f -name 'MCYAS-IDConverter-*.jar' ! -name '*-thin.jar' || true)"
          if [ -z "${JAR}" ]; then
            echo "::error::No jar found in the downloaded artifact"
            ls -la dist
            exit 1
          fi

          JAVA_BIN="${{ steps.runtime.outputs.java-home }}/bin/java"
          echo "Launching ${JAR}"
          "${JAVA_BIN}" -version

          if ! OUTPUT="$("${JAVA_BIN}" -jar "${JAR}" -v 2>&1)"; then
            echo "::error::Artifact failed to launch on JDK ${{ matrix.jdk }}"
            echo "${OUTPUT}"
            exit 1
          fi

          echo "${OUTPUT}"
          if ! printf '%s' "${OUTPUT}" | grep -q 'MCYAS-IDConverter v'; then
            echo "::error::Artifact did not print its version banner on JDK ${{ matrix.jdk }}"
            exit 1
          fi

  deploy-pages:
    name: Deploy Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
